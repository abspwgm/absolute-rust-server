# =============================================================================
# Absolute Rust Server - E2E Test Workflow
# =============================================================================
# Runs end-to-end tests on every push and pull request.
# Caches server files to speed up subsequent runs.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, develop]
  # Any base, not just main. A pull request stacked on another branch is still
  # a change that has to be gated; filtering on [main] meant stacked work
  # merged with no checks at all and only got tested once the stack landed.
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip server file cache'
        required: false
        default: false
        type: boolean

# Least privilege for GITHUB_TOKEN
permissions:
  contents: read

# The self-hosted pool runs several runner instances on one machine sharing one
# Docker daemon, and this suite uses fixed container and volume names
# (rust-server, rust-test-server). Two concurrent runs would tear down each
# other's resources. Serialised per repository, not per ref, because the
# collision is over those names rather than over the branch.
concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: false

env:
  RUST_APP_ID: '258550'

jobs:
  # -------------------------------------------------------------------------
  # Static checks (fast, no Docker)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck container scripts and tests
        run: |
          shellcheck --version
          shellcheck -S error -s bash -x scripts/* tests/*.sh tests/e2e/*.sh

      - name: Unit tests (no Docker)
        run: |
          # tests/test_helpers.sh is the shared e2e library, not a test.
          for t in tests/test_*.sh; do
            case "$(basename "${t}")" in test_helpers.sh) continue ;; esac
            echo "--- ${t}"
            bash "${t}"
          done

  e2e-tests:
    name: End-to-End Tests
    # Fork pull requests NEVER run on our own hardware: a fork can change both
    # the workflow and the tests it runs, and this runner shares a machine with
    # live game servers. They go to a GitHub-hosted runner, free for public
    # repositories. Everything else takes the org pool, which holds the Steam
    # depot cache - this suite's wall clock is mostly the download.
    runs-on: ${{ fromJSON(
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
      && '["ubuntu-latest"]'
      || '["self-hosted","linux","x64","absolute-e2e"]') }}
    timeout-minutes: 90

    steps:
      # ---------------------------------------------------------------------
      # Checkout and Setup
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---------------------------------------------------------------------
      # Cache Server Files
      # ---------------------------------------------------------------------
      # The game learns the lab's public address from Steam and prints it: a
      # Source server's `status` carries it, and every console command's output
      # reaches the container log. On a public repository this log is public.
      # So on lab hardware the address is learned first and masked, which makes
      # GitHub redact every later occurrence in this log; after the suite it is
      # scrubbed from what is uploaded, and the job fails if the suite printed
      # it. Learned at run time, never stored: a residential address changes.
      # A hosted runner's address is GitHub's, and nothing is hidden. Fails
      # closed: a suite whose log cannot be redacted does not run here.
      - name: Mask the runner's public address
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          addresses=""
          for family in 4 6; do
            address=""
            for probe in https://checkip.amazonaws.com https://api64.ipify.org; do
              address="$(curl -${family} -fsS --max-time 10 "${probe}" 2>/dev/null | tr -d '[:space:]')" && [ -n "${address}" ] && break
              address=""
            done
            case "${family}:${address}" in
              4:*.*.*.*) ;;
              6:*:*) ;;
              *) address="" ;;
            esac
            if [ -n "${address}" ]; then
              echo "::add-mask::${address}"
              addresses="${addresses:+${addresses} }${address}"
            fi
          done
          case "${addresses}" in
            *.*.*.*) ;;
            *) echo "::error::Could not learn this runner's public IPv4 address, so this log cannot be redacted. Refusing to run the suite on lab hardware."; exit 1 ;;
          esac
          echo "RUNNER_PUBLIC_ADDRESS=${addresses}" >> "$GITHUB_ENV"
          echo "The runner's public address is masked for the rest of this job"

      - name: Create cache directories
        run: |
          mkdir -p data/server
          mkdir -p data/config

      # On the self-hosted pool the depot cache is already on local disk, kept
      # current by a root-owned timer that no pull request can influence.
      # Copying from it beats pulling the same gigabytes back over the internet.
      # A copy, never a hardlink: the suite runs steamcmd against these files
      # and a hardlink would let a job write through into the shared cache.
      - name: Seed server files from the local depot cache
        id: local-cache
        if: ${{ runner.environment == 'self-hosted' && github.event.inputs.skip_cache != 'true' }}
        run: |
          src="/srv/steam-cache/${{ env.RUST_APP_ID }}"
          if [ -f "${src}/RustDedicated" ]; then
            cp -a "${src}/." data/server/
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "✅ seeded from ${src} ($(du -sh data/server | cut -f1))"
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ no usable local depot cache at ${src}; falling back"
          fi

      # Skipped entirely when seeded locally, which skips the multi-gigabyte
      # upload back to GitHub at the end of the job as well as the restore.
      - name: Restore server file cache
        if: ${{ github.event.inputs.skip_cache != 'true' && steps.local-cache.outputs.seeded != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: server-cache
        with:
          path: data/server
          key: rust-server-${{ env.RUST_APP_ID }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            rust-server-${{ env.RUST_APP_ID }}-

      - name: Cache status
        run: |
          if [ "${{ steps.server-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Server files restored from cache"
            ls -la data/server/ || true
          else
            echo "No cache found, server files will be downloaded"
          fi

      # ---------------------------------------------------------------------
      # Build Docker Image
      # ---------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-rust-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # Run E2E Tests
      # ---------------------------------------------------------------------
      - name: Make test scripts executable
        run: |
          chmod +x tests/run_e2e.sh
          chmod +x tests/test_helpers.sh
          chmod +x tests/e2e/*.sh

      - name: Cleanup any existing containers
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f rust-server 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker volume rm rust-test-config rust-test-server 2>/dev/null || true

      - name: Pre-populate server volume from cache
        if: ${{ steps.server-cache.outputs.cache-hit == 'true' || steps.local-cache.outputs.seeded == 'true' }}
        run: |
          echo "Pre-populating Docker volume from cached server files..."
          # Create the volume
          docker volume create rust-test-server
          # Use a temporary container to copy files into the volume
          docker run --rm -v rust-test-server:/data -v $(pwd)/data/server:/cache alpine sh -c "cp -r /cache/. /data/ 2>/dev/null || true"
          echo "Cache pre-population complete"
          # Show what was copied
          docker run --rm -v rust-test-server:/data alpine ls -la /data/ | head -20 || true

      # Through tee, so the scrub below can read what the suite printed; the
      # exit code stays the suite's. The periodic status dumps the container's
      # log through the scrubbing helper, never raw.
      - name: Run E2E test suite
        id: e2e-tests
        run: |
          mkdir -p test-artifacts
          ( set -o pipefail; ./tests/run_e2e.sh 2>&1 | tee test-artifacts/suite.log ) &
          TEST_PID=$!

          # Monitor and show status every 5 minutes while tests run
          while kill -0 $TEST_PID 2>/dev/null; do
            sleep 300
            echo "=== Status check at $(date) ==="
            docker ps -a || true
            bash -c 'source tests/test_helpers.sh; dump_container_logs rust-server 20'
            echo "=== End status check ==="
          done

          # Wait for tests to complete and get exit code
          wait $TEST_PID
        env:
          TEST_TIMEOUT: 900
          STARTUP_WAIT: 900

      # ---------------------------------------------------------------------
      # Collect Artifacts (always, for debugging)
      # ---------------------------------------------------------------------
      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker logs rust-server > test-artifacts/container.log 2>&1 || true
          docker inspect rust-server > test-artifacts/container-inspect.json 2>&1 || true
          cp -r data/logs/* test-artifacts/ 2>/dev/null || true

      # Masking covers this log; it does not cover what is uploaded, and an
      # artifact of a public repository is downloadable by anyone signed in. So
      # the address is scrubbed from everything under test-artifacts, and the
      # job fails if the suite itself printed it: the mask is the net, not the
      # floor. A test quotes what it asserts, and dumps a container's log
      # through dump_container_logs, which scrubs. The server's own log will
      # carry the address - Source servers print it - which is why that file is
      # scrubbed rather than judged.
      - name: Scrub the runner's address from the artifacts, and fail if the suite printed it
        if: ${{ always() && env.RUNNER_PUBLIC_ADDRESS != '' }}
        run: |
          printed=0
          for address in ${RUNNER_PUBLIC_ADDRESS}; do
            if grep -qF -- "${address}" test-artifacts/suite.log 2>/dev/null; then
              printed=1
            fi
            escaped="$(printf '%s' "${address}" | sed 's/[][\.*^$/]/\\&/g')"
            find test-artifacts -type f -exec sed -i "s/${escaped}/<runner-public-address>/g" {} +
          done
          remaining=0
          for address in ${RUNNER_PUBLIC_ADDRESS}; do
            grep -rqF -- "${address}" test-artifacts 2>/dev/null && remaining=1
          done
          if [ "${remaining}" = "1" ]; then
            echo "::error::The scrub left the runner's address in test-artifacts; nothing is uploaded from this run"
            rm -rf test-artifacts
            exit 1
          fi
          if [ "${printed}" = "1" ]; then
            echo "::error::The suite printed the runner's public address. This log is masked and the artifact is scrubbed, but a test that prints raw server output is the defect: quote what you assert, and dump a container's log through dump_container_logs."
            exit 1
          fi
          echo "test-artifacts carry no address of ours"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-logs
          path: test-artifacts/
          retention-days: 7

      # The ready-ladder verdict (standard 2.10), on its own so the fleet board's
      # collector can read it without unpacking logs. It is transport, not the
      # record: the hub keeps the last conclusive verdict for itself (2.11), so
      # this expiring does not blank the board during a long outage.
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict
          path: data/logs/verdict.json
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------------
      # Update Server File Cache
      # ---------------------------------------------------------------------
      - name: Save server files to cache
        if: always()
        run: |
          # Copy server files from container volume if tests ran
          if docker ps -a | grep -q rust-server; then
            echo "Extracting server files for cache..."
            docker cp rust-server:/opt/rust/server/. data/server/ 2>/dev/null || true
            ls -la data/server/ | head -20 || true
          fi

      # `docker cp` above writes into the workspace as root. On a hosted runner
      # the machine is discarded so it never matters; on a self-hosted one the
      # workspace outlives the job and the next checkout dies with
      # "EACCES: permission denied, rmdir" before a single test runs. Anything
      # a container leaves behind as root is a landmine for the next run.
      - name: Reclaim ownership of the workspace
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" data || true

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f rust-server 2>/dev/null || true
          docker volume rm rust-test-config rust-test-server 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Build Verification (no server download)
  # -------------------------------------------------------------------------
  build-only:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-rust-server:build-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image structure
        run: |
          # Check that required scripts exist
          docker run --rm absolute-rust-server:build-test ls -la /opt/rust/scripts/

          # Check that steamcmd is installed
          docker run --rm absolute-rust-server:build-test ls -la /opt/steamcmd/

          # Check supervisor config
          docker run --rm absolute-rust-server:build-test cat /etc/supervisor/conf.d/rust.conf
