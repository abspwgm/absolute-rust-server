# =============================================================================
# Publish: GHCR for testing, Docker Hub for the public
# =============================================================================
# Two registries, two audiences (absolute-game-servers docs/PLAN.md, "Registries"):
#
#   ghcr.io/abspwgm/<repo>    PRIVATE. Every build that passed E2E on main, for
#                             us to test. Never linked from a README or a guide.
#   docker.io/abspowergaming/<repo>  PUBLIC. What strangers pull. Only from a public
#                             repository, because a public repository is the
#                             claim that the image works (publication gate).
#
# Docker Hub receives the GHCR image by digest rather than a second build, so
# the bytes the public pulls are exactly the bytes we published for testing.
# =============================================================================

name: Publish Docker Image

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/abspowergaming/${{ github.event.repository.name }}

jobs:
  ghcr:
    name: Publish to GHCR (private, testing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run's `branches: [main]` matches the run's head branch by name,
    # and a fork pull request from the fork's own `main` has head branch "main"
    # too. Only an E2E run triggered by a push to this repository publishes;
    # otherwise a fork could have its code built and pushed with our tokens.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out the default branch head; pin to the commit
          # whose E2E actually passed, so a later push is never published untested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub:
    name: Promote to Docker Hub (public)
    needs: ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The publication gate: a private repository's image stays on GHCR.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      packages: read
    steps:
      # Fail loudly rather than skip: a public repository whose image silently
      # never reaches Docker Hub is exactly the defect this workflow replaced.
      - name: Docker Hub credentials are configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this repository. Set them as organization secrets."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same tags as GHCR, same digest. imagetools copies the index, so the
      # provenance and SBOM attestations travel with it.
      - name: Copy the GHCR image to Docker Hub by digest
        env:
          DIGEST: ${{ needs.ghcr.outputs.digest }}
          TAGS: ${{ needs.ghcr.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            args+=(--tag "${DOCKERHUB_IMAGE}:${tag##*:}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${GHCR_IMAGE}@${DIGEST}"
          {
            echo "## Published to Docker Hub"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo '```'
            printf '%s\n' "${args[@]}" | grep -v -- '--tag'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
