# =============================================================================
# Absolute Rust Server - Docker Compose Configuration
# =============================================================================
# Production configuration for running the Rust dedicated server
# =============================================================================

services:
  rust-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: absolute-rust-server:latest
    container_name: rust-server
    # Must exceed supervisor stopwaitsecs (150s), which must exceed the server's
    # own save wait (120s). Without this docker stop killed the server after
    # 10s and the world save was lost (#5).
    stop_grace_period: 180s
    restart: unless-stopped

    # Ports
    ports:
      - "28015:28015/udp"   # Game port
      - "27015:27015/udp"   # Query port
      # RCON and WebRCON are admin ports: bound to localhost so they are not
      # exposed to the network. Only widen these if you know you need to.
      - "127.0.0.1:28016:28016/tcp"   # RCON port
      - "127.0.0.1:28017:28017/tcp"   # RCON Web port

    # Volumes
    volumes:
      - rust-server:/opt/rust/server
      - rust-config:/config

    # Environment variables - customize as needed
    environment:
      # Server Settings
      - SERVER_NAME=My Rust Server
      - SERVER_IDENTITY=rust_server
      - SERVER_SEED=
      - SERVER_WORLDSIZE=4000
      - SERVER_MAXPLAYERS=50
      - SERVER_LEVEL=Procedural Map
      - SERVER_DESCRIPTION=A Rust server running in Docker
      - SERVER_URL=
      - SERVER_HEADERIMAGE=
      - SERVER_SAVEINTERVAL=600

      # RCON Settings
      - RCON_ENABLED=true
      - RCON_PORT=28016
      # Leave empty to have a random password generated at /config/rcon_password
      - RCON_PASSWORD=${RCON_PASSWORD:-}
      - RCON_WEB=true
      - RCON_WEB_PORT=28017

      # Modding (Oxide/uMod)
      - ENABLE_OXIDE=false
      - OXIDE_AUTO_UPDATE=true

      # Update Settings
      - UPDATE_ON_START=true
      - UPDATE_IF_IDLE=true
      - UPDATE_CRON=
      - UPDATE_TIMEOUT=1800

      # Backup Settings
      - BACKUPS_ENABLED=true
      - BACKUPS_CRON=0 */6 * * *
      - BACKUPS_MAX_AGE=7
      - BACKUPS_MAX_COUNT=0

      # System Settings
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    # Health check
    healthcheck:
      test: ["CMD", "/opt/rust/scripts/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s

    # Resource limits (adjust based on your server)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
    #     reservations:
    #       memory: 4G

volumes:
  rust-server:
    name: rust-server
  rust-config:
    name: rust-config
